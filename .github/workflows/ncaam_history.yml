name: NCAAM historical results

# Manual: press "Run workflow" on the Actions tab and type the seasons.
# 2025 means the 2024-25 season. Ranges work: 2019-2026, and "current" means this season.
# Automatic: every Monday at 09:07 UTC (about 5:07 am Eastern) it refreshes the current season only,
# so the model's formula-health check always has recent results to look at.
on:
  schedule:
    - cron: "7 9 * * 1"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to pull, e.g. 2025 or 2019-2026 or 2023,2025 or current"
        required: true
        default: "current"
      only_missing:
        description: "Skip seasons that already have a file (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Pull results
        env:
          SEASONS: ${{ github.event.inputs.seasons || 'current' }}
          ONLY_MISSING: ${{ github.event.inputs.only_missing || 'false' }}
        run: |
          if [ "$ONLY_MISSING" = "true" ]; then
            python ncaam_history_pull.py --seasons "$SEASONS" --only-missing
          else
            python ncaam_history_pull.py --seasons "$SEASONS"
          fi
      - name: Commit results
        run: |
          git config user.name "edge-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history
          git diff --staged --quiet || git commit -m "NCAAM historical results $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
